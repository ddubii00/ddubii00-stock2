<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Market Top Boards</title>
    <link rel="stylesheet" href="/styles.css?v=20260905a" />
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/app.js?v=20260905a" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow" id="eyebrow">Korea Market Cap</p>
        <h1 id="pageTitle">오늘 KOSPI 시가총액 Top 100</h1>
      </div>
      <button class="refresh-button" id="refreshButton" type="button">
        새로고침
      </button>
    </header>

    <main>
      <nav class="market-tabs" aria-label="시장 선택">
        <button class="market-tab is-active" type="button" data-market="kospi">
          KOSPI Top 100
        </button>
        <button class="market-tab" type="button" data-market="kosdaq">
          KOSDAQ Top 50
        </button>
        <button class="market-tab" type="button" data-market="nasdaq100">
          NASDAQ 100
        </button>
        <button class="market-tab" type="button" data-market="dow">
          Dow
        </button>
        <button class="market-tab" type="button" data-market="screener">
          종목순위
        </button>
      </nav>

      <section class="status-band" aria-live="polite">
        <div>
          <span class="label">기준</span>
          <strong id="sourceLabel">-</strong>
        </div>
        <div>
          <span class="label">업데이트</span>
          <strong id="updatedAt">-</strong>
        </div>
        <div>
          <span class="label">표시</span>
          <strong id="visibleCount">0개</strong>
        </div>
      </section>

      <section class="screener-controls" id="screenerControls" aria-label="종목순위 조건">
        <label>
          <span>시장</span>
          <select id="screenerMarketSelect">
            <option value="kospi">KOSPI</option>
            <option value="kosdaq">KOSDAQ</option>
          </select>
        </label>
        <label>
          <span>범위</span>
          <select id="screenerScopeSelect">
            <option value="top100">시총100</option>
            <option value="all">전체</option>
          </select>
        </label>
        <label>
          <span>표시 개수</span>
          <select id="screenerLimitSelect">
            <option value="100">100개</option>
            <option value="200">200개</option>
            <option value="300">300개</option>
            <option value="400">400개</option>
            <option value="500">500개</option>
          </select>
        </label>
        <label>
          <span>정렬기준</span>
          <select id="screenerSort1Select">
            <option value="marketCap">시가총액</option>
            <option value="rank">시총순위</option>
            <option value="changeRate">등락률</option>
            <option value="volume">거래량</option>
            <option value="tradingValue">거래액</option>
            <option value="equity">자기자본</option>
            <option value="per">PER</option>
            <option value="forwardPer">Forward PER</option>
            <option value="roe">ROE</option>
            <option value="pbr">PBR</option>
            <option value="roa">ROA</option>
            <option value="reserveRatio">유보율</option>
            <option value="eps">EPS</option>
          </select>
        </label>
        <label>
          <span>방향</span>
          <select id="screenerDirection1Select">
            <option value="desc">내림차순</option>
            <option value="asc">오름차순</option>
          </select>
        </label>
        <button type="button" id="applyScreenerButton">적용</button>
      </section>

      <section class="metrics" aria-label="시장 요약">
        <article>
          <span>상승</span>
          <strong class="up" id="upCount">0</strong>
        </article>
        <article>
          <span>하락</span>
          <strong class="down" id="downCount">0</strong>
        </article>
        <article>
          <span>평균 등락률</span>
          <strong id="avgRate">0.00%</strong>
        </article>
        <article>
          <span id="fourthMetricLabel">시총 합계</span>
          <strong id="totalMarketCap">0조</strong>
        </article>
      </section>

      <section class="controls stock-search-controls" aria-label="전체 종목 검색">
        <label class="search-box">
          <span>전체 종목 검색</span>
          <input
            id="searchInput"
            type="search"
            placeholder="KOSPI·KOSDAQ 종목명 또는 코드"
            list="searchSuggestions"
            autocomplete="off"
          />
          <datalist id="searchSuggestions"></datalist>
          <div id="searchSuggestionMenu" class="search-suggestion-menu"></div>
        </label>
      </section>

      <section class="table-wrap" aria-label="KOSPI 시가총액 상위 100개 종목">
        <div class="message" id="message">데이터를 불러오는 중입니다.</div>
        <table>
          <thead>
            <tr>
              <th id="rankHeader">시총 순위</th>
              <th>종목</th>
              <th class="numeric" id="priceHeader">주가(원)</th>
              <th class="numeric">등락률</th>
              <th class="numeric">전일비</th>
              <th class="numeric" id="extraHeader">시가총액(조)</th>
              <th class="numeric">매출(조)</th>
              <th class="numeric">영업이익(조)</th>
              <th class="numeric">자기자본(조)</th>
              <th class="numeric">PER</th>
              <th class="numeric">Forward PER</th>
              <th class="numeric">ROE</th>
              <th class="numeric">PBR</th>
              <th class="numeric">거래량</th>
              <th class="numeric">거래액(조)</th>
              <th class="numeric">ROA</th>
              <th class="numeric">유보율</th>
              <th class="numeric">EPS</th>
            </tr>
          </thead>
          <tbody id="stockRows"></tbody>
        </table>
      </section>

      <section class="chart-modal" id="chartModal" aria-hidden="true">
        <div class="chart-modal-backdrop" id="chartBackdrop"></div>
        <div class="chart-modal-content">
          <header class="chart-header">
            <strong id="chartTitle">차트</strong>
            <div class="period-buttons">
              <button type="button" class="period-btn is-active" data-timeframe="day">일봉</button>
              <button type="button" class="period-btn" data-timeframe="week">주봉</button>
              <button type="button" class="period-btn" data-timeframe="month">월봉</button>
            </div>
            <label>
              <span>조회 기간</span>
              <input id="daysInput" type="number" min="30" max="1200" step="10" value="200" />
            </label>
            <button type="button" id="applyDaysButton">적용</button>
            <button type="button" id="closeChartButton">닫기</button>
          </header>
          <div id="chartReturnSummary" class="chart-return-summary"></div>
          <div class="chart-stack">
            <div id="priceLegend" class="chart-legend"></div>
            <div id="priceChart" class="chart-box chart-price"></div>
            <div id="volumeChart" class="chart-box chart-volume"></div>
            <div id="macdChart" class="chart-box chart-macd"></div>
            <div class="chart-subheader">
              <div class="period-buttons" id="ichimokuPeriodButtons">
                <button type="button" class="period-btn is-active" data-ichi-timeframe="day">일봉</button>
                <button type="button" class="period-btn" data-ichi-timeframe="week">주봉</button>
                <button type="button" class="period-btn" data-ichi-timeframe="month">월봉</button>
              </div>
              <label>
                <span>일목 조회 기간</span>
                <input id="ichimokuDaysInput" type="number" min="30" max="1200" step="10" value="200" />
              </label>
              <button type="button" id="applyIchimokuDaysButton">적용</button>
            </div>
            <div id="ichimokuLegend" class="chart-legend"></div>
            <div id="ichimokuChart" class="chart-box chart-ichimoku"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
